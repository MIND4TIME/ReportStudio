name: Gerar data.json (Tally)

# Puxa as submissões de todas as forms do Tally, normaliza e (opcional)
# commita o data.json. Enquanto validamos, corre só MANUALMENTE e em
# dry-run por omissão — não escreve nada. O agendamento liga-se depois.

on:
  workflow_dispatch:
    inputs:
      write:
        description: "Escrever e commitar o data.json? (deixa 'false' para testar)"
        type: boolean
        default: false
  # schedule:                # ligar depois de validado
  #   - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerar (dry-run)
        if: ${{ inputs.write == false }}
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
        run: node generator/generate-data.mjs --dry-run

      - name: Gerar e commitar
        if: ${{ inputs.write == true }}
        env:
          TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
        run: |
          node generator/generate-data.mjs
          if [[ -n "$(git status --porcelain data.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Atualização automática do data.json (Tally)"
            git push
          else
            echo "Sem alterações."
          fi
